spring.application.name=blind-chess

# Server Configuration
server.port=${PORT:8080}

# Discord Bot Token
discord.bot.token=${DISCORD_BOT_TOKEN}

# Stockfish Path
stockfish.path=${STOCKFISH_PATH:stockfish}

# OpenRouter API (for Grok LLM responses)
openrouter.api.key=${OPENROUTER_API_KEY:}

# Logging
logging.level.root=INFO
logging.level.com.railway.blindchess=DEBUG
